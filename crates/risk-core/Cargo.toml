[package]
name = "risk-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
metrics = "0.23"
thiserror = "1"
anyhow = "1"
flate2 = "1"
bytes = "1"
memmap2 = "0.9"
itoa = "1"
ryu = "1"
clap = { version = "4", features = ["derive"] }
pprof = { version = "0.14", features = ["flamegraph"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
risk-quickscorer = { path = "../risk-quickscorer" }
risk-quickscorer-standalone-l2 = { path = "../risk-quickscorer-standalone-l2" }
[features]
default = []
