[package]
name = "risk-server-tokio"
version = "0.1.0"
edition = "2021"

[dependencies]
risk-core = { path = "../risk-core", default-features = false }
risk-quickscorer-standalone-l2 = { path = "../risk-quickscorer-standalone-l2" }
axum = "0.7"
bytes = "1"
h2 = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
tower = { version = "0.4", features = ["full"] } # 必须加 full，否则 limit/load_shed 还是找不到
tower-http = { version = "0.6", features = ["trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
